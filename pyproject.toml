[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "local-secret-review"
version = "1.0.3"
description = "Offline, redacted secret exposure review for owned source trees"
readme = "项目文档/README.md"
requires-python = ">=3.10"
license = {file = "项目文档/LICENSE"}
authors = [{name = "dhtfish98"}]
dependencies = []

[project.scripts]
local-secret-review = "local_secret_review.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools]
license-files = ["项目文档/LICENSE"]
