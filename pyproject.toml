[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "local-secret-review"
version = "1.0.1"
description = "Offline, redacted secret exposure review for owned source trees"
readme = "README.md"
requires-python = ">=3.10"
license = {file = "LICENSE"}
authors = [{name = "dhtfish-98"}]
dependencies = []

[project.scripts]
local-secret-review = "local_secret_review.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
